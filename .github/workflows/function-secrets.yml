name: Server keys

# GitHub 시크릿의 키를 서버 전용 테이블(app_secrets)로 옮김 — Edge Function 이 읽음. 값은 로그에 찍히지 않음
#  지금은 OPINET_API_KEY — 주유소 등록 신청의 오피넷 검색(opinet-search)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/function-secrets.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DATA_KEY: ${{ secrets.SUPABASE_DATA_KEY }}
      OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
      SB_URL: https://srpcirbgrifyvkplmkoe.supabase.co
    steps:
      - name: 키 옮기기
        run: |
          if [ -z "$SUPABASE_DATA_KEY" ] || [ -z "$OPINET_API_KEY" ]; then
            echo "::error::SUPABASE_DATA_KEY / OPINET_API_KEY 시크릿이 필요합니다"
            exit 1
          fi
          AUTH=()
          case "$SUPABASE_DATA_KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $SUPABASE_DATA_KEY");; esac
          body=$(jq -nc --arg v "$OPINET_API_KEY" '{name: "OPINET_API_KEY", value: $v, updated_at: (now | todate)}')
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$SB_URL/rest/v1/app_secrets?on_conflict=name" \
            -H "apikey: $SUPABASE_DATA_KEY" "${AUTH[@]}" -H 'Content-Type: application/json' \
            -H 'Prefer: resolution=merge-duplicates,return=minimal' -d "$body")
          echo "응답 $code"
          if [ "$code" -ge 300 ]; then head -c 300 /tmp/out; exit 1; fi
