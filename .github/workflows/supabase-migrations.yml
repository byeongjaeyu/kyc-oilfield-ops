name: Supabase migrations

# supabase/migrations 에 SQL 파일을 추가해 main 에 푸시하면 원격 DB 에 자동 적용
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: srpcirbgrifyvkplmkoe
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0 # latest 는 GitHub API 한도에 걸릴 수 있어 고정

      - name: 비밀값 확인
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD 시크릿이 필요합니다 (README 참고)"
            exit 1
          fi

      - name: 프로젝트 연결
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: 적용할 마이그레이션 확인
        run: supabase db push --remote --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: 적용
        run: supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"
